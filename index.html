<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090f">
<meta name="description" content="Delta AI Roblox compatibility assistant.">

<link rel="manifest" href="./manifest.json">

<title>Delta AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #09090f;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    min-height: 100vh;
}

header {
    padding: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #292939;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    color: #a66cff;
}

.badge {
    background: #211536;
    color: #bc91ff;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 11px;
}

main {
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

.hero {
    text-align: center;
    padding: 40px 10px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.hero span {
    color: #a66cff;
}

.hero p {
    color: #9999aa;
    line-height: 1.7;
}

.card {
    background: #12121c;
    border: 1px solid #272738;
    border-radius: 17px;
    padding: 21px;
    margin-bottom: 17px;
}

.card h2 {
    font-size: 18px;
    margin-bottom: 12px;
}

.description {
    color: #9999aa;
    font-size: 14px;
    line-height: 1.7;
}

.status {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.online {
    color: #69e6a0;
    font-size: 13px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 11px;
    background: #9455ef;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

input {
    width: 100%;
    background: #09090f;
    border: 1px solid #343447;
    border-radius: 10px;
    padding: 14px;
    color: white;
    margin-top: 12px;
}

.chat {
    min-height: 65px;
    padding: 13px;
    background: #09090f;
    border-radius: 10px;
    margin-top: 12px;
    color: #c5c5d5;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
}

footer {
    text-align: center;
    color: #666678;
    padding: 30px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">DELTA AI</div>
    <div class="badge">KEYLESS</div>
</header>

<main>

<section class="hero">
    <h1>Welcome to <span>Delta AI</span></h1>
    <p>Your Roblox compatibility assistant.<br>
    Smarter monitoring. Easier updates.</p>
</section>

<section class="card">
    <div class="status">
        <h2>Roblox Status</h2>
        <span class="online" id="robloxStatus">Checking...</span>
    </div>
    <p class="description">
        Monitor Roblox service availability.
    </p>
    <button onclick="checkRoblox()">Check Roblox</button>
</section>

    <h2>Automatic Update Monitor</h2>
    <p class="description">

        a new
